<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <img id="brandLogo" alt="" hidden>
    <span class="rule" id="brandRule" hidden></span>
    <span class="ks">KeepSake</span>
  </div>
  <div class="status" id="status"><i></i><span id="statusText">Offline · everything stays on this laptop</span></div>
</header>

<div class="intro-mark" id="introMark" aria-hidden="true">
  <img id="introLogo" alt="" hidden>
  <p>culling by <span>KeepSake</span></p>
</div>

<main>
  <!-- 1. choose a wedding -->
  <section class="screen" id="welcome">
    <div class="head">
      <p class="kicker" id="kicker">Wedding photo culling</p>
      <h1>The best frame of <em>every moment.</em></h1>
    </div>
    <div class="foot">
      <div class="chooser" id="chooser">
        <button class="btn gold" id="chooseBtn">Choose wedding folder</button>
        <form class="paste" id="pasteForm" autocomplete="off">
          <input id="pathInput" placeholder="or paste a folder path" spellcheck="false">
          <button class="link" type="submit">Use</button>
        </form>
        <div class="recent" id="recent" hidden></div>
      </div>

      <div class="sheet" id="setup" hidden>
        <div class="s-row s-head">
          <div class="grow">
            <div class="s-name" id="wName"></div>
            <div class="s-path" id="wPath"></div>
          </div>
          <button class="link" id="changeBtn">Change</button>
        </div>
        <div class="s-row">
          <span class="s-label">Keep</span>
          <div class="seg" id="keepSeg">
            <button data-keep="0.07">Fewer</button><button data-keep="studio" class="on">Studio style</button><button data-keep="0.15">More</button>
          </div>
          <span class="s-note" id="keepNote">about 1 in 10, like your studio</span>
        </div>
        <div class="s-row">
          <span class="s-label">Save to</span>
          <span class="s-path grow" id="outPath"></span>
          <button class="link" id="outBtn">Change</button>
        </div>
        <label class="s-row toggle">
          <input type="checkbox" id="copyNot"><span class="sw"></span>
          <span class="grow">Also copy the Not selected photos <span class="s-note" id="copyHint"></span></span>
        </label>
        <button class="btn gold wide" id="startBtn">Start culling</button>
        <div class="s-foot" id="setupNote"></div>
      </div>
    </div>
  </section>

  <!-- 2. working -->
  <section class="screen" id="working">
    <div class="head">
      <p class="kicker">Culling</p>
      <h2 id="wkName"></h2>
    </div>
    <div class="foot">
      <div class="pct"><span id="pct">0</span><span class="pc">%</span></div>
      <div class="track"><i id="ovBar"></i></div>
      <ol class="steps" id="steps"></ol>
      <div class="meta">
        <span id="stageNow"></span><span class="sep"></span><span id="eta"></span><span class="sep"></span><span id="elapsed"></span>
        <button class="link" id="stopBtn">Stop</button>
      </div>
    </div>
  </section>

  <!-- 3. done -->
  <section class="screen" id="done">
    <div class="head">
      <p class="kicker" id="doneKicker">Finished</p>
      <h2><span id="doneSel">0</span> photos <em>made the cut.</em></h2>
      <p class="sub" id="doneSub"></p>
    </div>
    <div class="foot">
      <div class="actions">
        <button class="btn gold" data-open="selected">Open Selected</button>
        <button class="btn line" data-gallery="selected">View photos</button>
        <button class="btn line" data-open="not_selected" id="openNot">Open Not selected</button>
      </div>
      <div class="stats" id="stats"></div>
      <button class="link" id="againBtn">Cull another wedding</button>
    </div>
  </section>
</main>

<div class="gallery" id="gallery" hidden>
  <div class="g-head">
    <h3 id="gTitle">Selected</h3><span class="g-count" id="gCount"></span>
    <div class="seg" id="gSeg"><button data-set="selected" class="on">Selected</button><button data-set="not_selected">Not selected</button></div>
    <button class="link close" id="gClose">Close</button>
  </div>
  <div class="g-grid" id="gGrid"></div>
</div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close" title="Close (Esc)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-btn lb-nav prev" id="lbPrev" aria-label="Previous photo" title="Previous (←)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="lb-stage"><img alt=""></div>
  <button class="lb-btn lb-nav next" id="lbNext" aria-label="Next photo" title="Next (→)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="lb-info"><span class="lb-count" id="lbCount"></span><span class="lb-name" id="lbName"></span><span class="lb-reason" id="lbReason"></span></div>
  <button class="lb-btn lb-move" id="lbMove" title="Move this photo to the other folder (M)"></button>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
